version: 1

rules:
  decision_stage: review
  max_categories_per_article: 1
  allow_unlisted_categories: false
  when_unmatched: omit

categories:
  - name: AI 与 Agent
    description: 人工智能、大模型、Agent 与人机协作工作流。
    tag_hints: [AI, Agent, LLM, RAG]
  - name: 软件开发与数据
    description: 编程、软件设计、数据工程与数据分析。
    tag_hints: [编程, 架构, Python, Rust, 数据]
  - name: 工具与自动化
    description: 提效工具、命令行、工作流自动化与个人效率实践。
    tag_hints: [工具, 自动化, CLI, 工作流]
  - name: 系统与基础设施
    description: Linux、容器、Kubernetes、网络、存储与自托管服务。
    tag_hints: [Linux, Docker, Kubernetes, K8s, 网络]
  - name: 售前与 B2B
    description: 售前工作、企业服务、客户沟通与方案设计。
    tag_hints: [售前, B2B, 企业服务, 方案]
  - name: 写作与知识管理
    description: 写作练习、笔记方法、知识库与个人信息管理。
    tag_hints: [写作, Logseq, 笔记, 知识管理]
  - name: 投资与思维模型
    description: 投资研究、决策框架、概率思维与认知模型。
    tag_hints: [投资, 决策, 思维模型, 概率]
  - name: 国学与中医
    description: 中医、儒道思想、易学、古籍与传统思想的学习记录。
    tag_hints: [中医, 国学, 儒家, 道家, 易学, 古籍]
  - name: 佛法学习
    description: 作为初学者对佛法概念、经论与学习体会的记录。
    tag_hints: [佛法, 佛学, 经论, 学习笔记]
